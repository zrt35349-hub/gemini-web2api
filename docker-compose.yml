services:
  chatgpt-web2api:
    build: .
    container_name: chatgpt-web2api
    ports:
      - "8100:8100"
    volumes:
      - ./chatgptwebapp2api/config.json:/app/chatgptwebapp2api/config.json:ro
      # - ./chatgptwebapp2api/gpt_cookie.txt:/app/chatgptwebapp2api/gpt_cookie.txt:ro
    restart: unless-stopped
